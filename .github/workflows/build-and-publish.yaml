---
name: Build and Publish for Main and Release branches

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - releases/**
  workflow_dispatch:

jobs:
  audit-containers:
    name: Audit - Containers
    uses: DFE-Digital/funding-service-workflows/.github/workflows/audit-container-trivy.yml@60ae4699af8c28e13901ce3902484a97e7c98708
    with:
      dockerfilePath: Pds.Admin.Api/Dockerfile
    secrets:
      buildArgs: --build-arg PDS_FEED_TOKEN=${{ secrets.PDS_FEED_TOKEN }}
  lint-yaml:
    name: Lint - YAML
    uses: DFE-Digital/funding-service-workflows/.github/workflows/lint-yaml.yml@60ae4699af8c28e13901ce3902484a97e7c98708
  build:
    name: Build and Publish
    uses: DFE-Digital/funding-service-workflows/.github/workflows/build-and-publish.yml@60ae4699af8c28e13901ce3902484a97e7c98708
    needs: [audit-containers, lint-yaml]
    secrets:
      buildArgs: PDS_FEED_TOKEN=${{ secrets.PDS_FEED_TOKEN }}
