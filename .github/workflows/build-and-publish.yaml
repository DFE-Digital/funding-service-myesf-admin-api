---
name: Build and Publish for Main and Release branches

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - releases/**
  workflow_dispatch:

jobs:
  audit-containers:
    name: Audit - Containers
    uses: DFE-Digital/funding-service-workflows/.github/workflows/audit-container-trivy.yml@b49733134d00397541e7abede01e019e9d5f9ec6
    with:
      dockerfilePath: Pds.Admin.Api/Dockerfile
    secrets:
      buildArgs: PDS_FEED_PAT=${{ secrets.PDS_FEED_TOKEN }}
  audit-dependencies:
    name: Audit - Dependencies
    uses: DFE-Digital/funding-service-workflows/.github/workflows/audit-dependency-dotnet.yml@b49733134d00397541e7abede01e019e9d5f9ec6
    strategy:
      fail-fast: false
      matrix:
        projects: [
          Pds.Admin.Api/Pds.Admin.Api.csproj,
          Pds.Admin.Services/Pds.Admin.Services.csproj,
          Pds.Admin.Services.Tests/Pds.Admin.Services.Tests.csproj,
          Pds.Admin.Api.Tests/Pds.Admin.Api.Tests.csproj
        ]
    with:
      nugetSourceUrl: https://sfa-gov-uk.pkgs.visualstudio.com/9fd46a3f-eada-41dc-86e9-36332aeb8ef1/_packaging/PDS/nuget/v3/index.json
      solution: ${{ matrix.projects }}
    secrets:
      nugetAuthToken: ${{ secrets.PDS_FEED_TOKEN }}
  lint-yaml:
    name: Lint - YAML
    uses: DFE-Digital/funding-service-workflows/.github/workflows/lint-yaml.yml@b49733134d00397541e7abede01e019e9d5f9ec6
  test-dotnet:
    name: Tests - .NET
    uses: DFE-Digital/funding-service-workflows/.github/workflows/test-dotnet.yml@b49733134d00397541e7abede01e019e9d5f9ec6
    strategy:
      fail-fast: false
      matrix:
        projects: [
          Pds.Admin.Services.Tests/Pds.Admin.Services.Tests.csproj,
          Pds.Admin.Api.Tests/Pds.Admin.Api.Tests.csproj
        ]
        testCategories: [
          Unit
        ]
    with:
      solution: ${{ matrix.projects }}
      filter: TestCategory=${{ matrix.testCategories }}
      nugetSourceUrl: https://sfa-gov-uk.pkgs.visualstudio.com/9fd46a3f-eada-41dc-86e9-36332aeb8ef1/_packaging/PDS/nuget/v3/index.json
    secrets:
      nugetAuthToken: ${{ secrets.PDS_FEED_TOKEN }}
  publish-test-results:
    if: always()
    needs: [test-dotnet]
    name: Publish Test Results
    uses: DFE-Digital/funding-service-workflows/.github/workflows/publish-test-results.yml@b49733134d00397541e7abede01e019e9d5f9ec6
  build:
    name: Build and Publish
    uses: DFE-Digital/funding-service-workflows/.github/workflows/build-and-publish.yml@b49733134d00397541e7abede01e019e9d5f9ec6
    needs: [audit-containers, audit-dependencies, lint-yaml, test-dotnet]
    with:
      dockerfilePath: Pds.Admin.Api/Dockerfile
    secrets:
      buildArgs: PDS_FEED_PAT=${{ secrets.PDS_FEED_TOKEN }}
