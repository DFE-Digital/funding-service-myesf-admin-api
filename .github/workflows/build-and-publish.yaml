---
name: Build and Publish for Main and Release branches

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - releases/**
  workflow_dispatch:

jobs:
  audit-containers:
    name: Audit - Containers
    uses: DFE-Digital/funding-service-workflows/.github/workflows/audit-container-trivy.yml@f15677ff143a1b77658aef842093d7f298dccc68
    with:
      dockerfilePath: Pds.Admin.Api/Dockerfile
    secrets:
      buildArgs: PDS_FEED_PAT=${{ secrets.PDS_FEED_TOKEN }}
  lint-yaml:
    name: Lint - YAML
    uses: DFE-Digital/funding-service-workflows/.github/workflows/lint-yaml.yml@f15677ff143a1b77658aef842093d7f298dccc68
  test-dotnet:
    name: Tests - .NET
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testCategories: [Unit]
    uses: DFE-Digital/funding-service-workflows/.github/workflows/test-dotnet.yml@f15677ff143a1b77658aef842093d7f298dccc68
    with:
      testCategories: ${{ matrix.testCategories }}
      nugetSourceUrl: https://sfa-gov-uk.pkgs.visualstudio.com/9fd46a3f-eada-41dc-86e9-36332aeb8ef1/_packaging/PDS/nuget/v3/index.json
    secrets:
      nugetAuthToken: ${{ secrets.PDS_FEED_TOKEN }}
  publish-test-results:
    if: always()
    needs: [test-dotnet]
    name: Publish Test Results
    uses: DFE-Digital/funding-service-workflows/.github/workflows/publish-test-results.yml@f15677ff143a1b77658aef842093d7f298dccc68
  build:
    name: Build and Publish
    uses: DFE-Digital/funding-service-workflows/.github/workflows/build-and-publish.yml@f15677ff143a1b77658aef842093d7f298dccc68
    needs: [audit-containers, lint-yaml, test-dotnet]
    with:
      dockerfilePath: Pds.Admin.Api/Dockerfile
    secrets:
      buildArgs: PDS_FEED_PAT=${{ secrets.PDS_FEED_TOKEN }}
