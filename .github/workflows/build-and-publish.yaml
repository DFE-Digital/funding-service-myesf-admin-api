---
name: Build and Publish for Main and Release branches

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - releases/**
  workflow_dispatch:

jobs:
  audit-containers:
    name: Audit - Containers
    uses: DFE-Digital/funding-service-workflows/.github/workflows/audit-container-trivy.yml@6402db955b546a64b95e7bcb3d00add685bf064f
    with:
      context: Pds.Admin.Api/
    secrets:
      buildArgs: ${{ secrets.DOCKER_BUILD_ARG }}
  lint-yaml:
    name: Lint - YAML
    uses: DFE-Digital/funding-service-workflows/.github/workflows/lint-yaml.yml@6402db955b546a64b95e7bcb3d00add685bf064f
  build:
    name: Build and Publish
    uses: DFE-Digital/funding-service-workflows/.github/workflows/build-and-publish.yml@6402db955b546a64b95e7bcb3d00add685bf064f
    needs: [audit-containers, lint-yaml]
    secrets: inherit
