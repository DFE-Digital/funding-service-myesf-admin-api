---
name: Build and Publish for Main and Release branches

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - releases/**
  workflow_dispatch:

jobs:
  audit-containers:
    name: Audit - Containers
    uses: DFE-Digital/funding-service-workflows/.github/workflows/audit-container-trivy.yml@79d9f69238217357e704dc22a762cda49e1f09a2
  lint-yaml:
    name: Lint - YAML
    uses: DFE-Digital/funding-service-workflows/.github/workflows/lint-yaml.yml@79d9f69238217357e704dc22a762cda49e1f09a2
  build:
    name: Build and Publish
    uses: DFE-Digital/funding-service-workflows/.github/workflows/build-and-publish.yml@79d9f69238217357e704dc22a762cda49e1f09a2
    needs: [audit-containers, lint-yaml]
    secrets: inherit
